{% load static %}<article class="product-card reveal"><a class="product-image" href="{{ product.get_absolute_url }}">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy">{% else %}<img src="{% if 'Home' in product.category.name %}{% static 'img/lifts/home-lift.jpg' %}{% elif 'Goods' in product.category.name %}{% static 'img/lifts/industrial-lift.jpg' %}{% elif 'Hospital' in product.category.name %}{% static 'img/lifts/hospital-lift.jpg' %}{% elif 'Commercial' in product.category.name %}{% static 'img/lifts/commercial-lift.jpg' %}{% else %}{% static 'img/lifts/passenger-lift.jpg' %}{% endif %}" alt="{{ product.name }} lift concept" loading="lazy">{% endif %}<span class="card-arrow">↗</span></a><div class="product-copy"><span class="product-category">{{ product.category.name }}</span><h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3><p>{{ product.summary|default:product.description|truncatewords:16 }}</p><a class="text-link" href="{{ product.get_absolute_url }}">View details <span>↗</span></a></div></article>
